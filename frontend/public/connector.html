<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <!-- Sửa lỗi Viewport trên mọi thiết bị -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trello AI Planner Connector</title>
    <!-- Thư viện bắt buộc của Trello Power-Up -->
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>

<body>
    <script>
        // ⚠️ QUAN TRỌNG: Thay chuỗi bên dưới bằng Trello API Key của Power-Up của bạn
        // (Lấy tại https://trello.com/power-ups/admin) để tính năng OAuth 1-Click hoạt động
        const APP_KEY = 'YOUR_TRELLO_API_KEY';
        const APP_NAME = 'AI WBS & RAG Planner';
        const DEFAULT_ICON = 'https://cdn.glitch.com/1b42d7ef-2d83-458b-9e2d-5ce2cc16315c%2Ficon.svg';

        window.TrelloPowerUp.initialize(
            {
                // 1. Nút bấm "AI Lập Kế Hoạch" ở cột phải bên trong thẻ Trello (Giữ nguyên luồng cũ của bạn)
                'card-buttons': function (t, options) {
                    return [{
                        icon: DEFAULT_ICON,
                        text: 'AI Lập Kế Hoạch',
                        callback: function (t) {
                            // Mở giao diện ReactJS (index.html) dưới dạng popup
                            return t.popup({
                                title: 'Phân rã công việc bằng GenAI',
                                url: './index.html',
                                height: 560
                            });
                        }
                    }];
                },

                // 2. Khung hiển thị trực tiếp ở mặt sau thẻ (Tùy chọn giúp PM nhìn bảng WBS rộng rãi hơn)
                'card-back-section': function (t, options) {
                    return {
                        title: '🤖 AI Lập Kế Hoạch Đa Sprint & RAG (WBS)',
                        icon: DEFAULT_ICON,
                        content: {
                            type: 'iframe',
                            url: t.signUrl('./index.html'),
                            height: 580
                        }
                    };
                },

                // 3. Hiển thị Card Badges trực tiếp ngoài mặt bảng Trello (Giờ công, Vai trò, Ưu tiên, RAG)
                'card-badges': async function (t, options) {
                    try {
                        const meta = await t.get('card', 'shared', 'aiTaskMeta', null);
                        if (!meta) return [];

                        const badges = [];

                        if (meta.estimatedHours) {
                            const hours = Number(meta.estimatedHours);
                            badges.push({
                                text: `⏱ ${hours}h`,
                                color: hours > 16 ? 'red' : 'blue'
                            });
                        }

                        if (meta.role) {
                            badges.push({
                                text: `💻 ${meta.role}`,
                                color: 'green'
                            });
                        }

                        if (meta.priority === 'High' || meta.priority === 'Critical') {
                            badges.push({
                                text: `🔥 ${meta.priority}`,
                                color: 'red'
                            });
                        }

                        if (meta.hasRag) {
                            badges.push({
                                text: '📖 RAG',
                                color: 'purple'
                            });
                        }

                        return badges;
                    } catch (err) {
                        return [];
                    }
                },

                // 4. Kiểm tra trạng thái kết nối tài khoản Trello (Chuẩn OAuth 1-Click)
                'authorization-status': async function (t, options) {
                    try {
                        const isAuthorized = await t.getRestApi().isAuthorized();
                        return { authorized: Boolean(isAuthorized) };
                    } catch (err) {
                        return { authorized: false };
                    }
                },

                // 5. Mở cửa sổ xác thực OAuth 1-Click khi người dùng bấm "Ủy quyền / Kết nối"
                'show-authorization': function (t, options) {
                    return t.getRestApi().authorize({
                        scope: 'read,write',
                        expiration: 'never'
                    });
                }
            },
            {
                appKey: APP_KEY,
                appName: APP_NAME
            }
        );
    </script>
</body>

</html>
